#cmd{flex:1;background:transparent;border:none;outline:none;color:#00ff41;font-family:'Share Tech Mono',monospace;font-size:14px;caret-color:#00ff41}

.line.err{color:#ff3b3b}

a{color:#00ccff;text-decoration:none}

.copy-btn:hover{background:#00ff41;color:#000}

/* Matrix canvas */
#matrixCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;display:none;background:#000}
#matrixCanvas.on{display:block}

/* QR */

/* loading dots */

// ===================== MD5 (خفيف) =====================
function md5(s){
function safeAdd(x,y){var lsw=(x&0xFFFF)+(y&0xFFFF);var msw=(x>>16)+(y>>16)+(lsw>>16);return(msw<<16)|(lsw&0xFFFF)}
function bitRotateLeft(num,cnt){return(num<<cnt)|(num>>>(32-cnt))}
function md5cmn(q,a,b,x,s,t){return safeAdd(bitRotateLeft(safeAdd(safeAdd(a,q),safeAdd(x,t)),s),b)}
function md5ff(a,b,c,d,x,s,t){return md5cmn((b&c)|(~b&d),a,b,x,s,t)}
function md5gg(a,b,c,d,x,s,t){return md5cmn((b&d)|(c&~d),a,b,x,s,t)}
function md5hh(a,b,c,d,x,s,t){return md5cmn(b^c^d,a,b,x,s,t)}
function md5ii(a,b,c,d,x,s,t){return md5cmn(c^(b|~d),a,b,x,s,t)}
function binlMD5(x,len){
x[len>>5]|=0x80<<((len)%32);

// ===================== التنفيذ =====================
var cmdInput = getEl('cmd');

cmdInput.addEventListener('keydown', async function(e){
if(e.key === 'Enter'){
var raw = cmdInput.value.trim();
if(!raw) return;
printPrompt(raw);
history.push(raw);
histIndex = history.length;
cmdInput.value = '';
var parts = raw.split(/\s+/);
var cmd = parts[0].toLowerCase();
var args = parts.slice(1);
if(commands[cmd]){
try{
await commands[cmd](args);
}catch(err){
print('❌ خطأ: ' + err.message, 'err');
}
}else{
print('❌ أمر غير معروف: ' + cmd, 'err');
print('اكتب help للأوامر المتاحة', 'warn');
}
}else if(e.key === 'ArrowUp'){
e.preventDefault();
if(histIndex > 0){ histIndex--; cmdInput.value = history[histIndex] || '' }
}else if(e.key === 'ArrowDown'){
e.preventDefault();
if(histIndex < history.length - 1){ histIndex++; cmdInput.value = history[histIndex] || '' }
else{ histIndex = history.length; cmdInput.value = '' }
}
});
